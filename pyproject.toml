[project]
name = "spatialdata-multiomics-demo"
version = "0.1.0"
description = "Multimodal (MuData) tables in SpatialData: environment, tutorial and benchmark."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cp-measure[numba]",
  "cupy-cuda13x>=14.2.0 ; sys_platform == 'linux'",
  "igraph",
  "ipykernel",
  "jupyterlab",
  "leidenalg",
  "mantispy",
  "mofaflex>=0.1.2",
  "mofapy2",
  "mudata>=0.4.1",
  "muon",
  "requests",
  "scanpy",
  "scikit-learn",
  "scvi-tools",
  "spatialdata",
  "spatialdata-io",
  "spatialdata-plot",
  "squidpy",
  "tifffile",
]

[tool.uv]
# an environment for the notebooks, not a package
package = false

# the development branches with MuData support; spatialdata-io comes from a fork until the branch is on scverse
[tool.uv.sources]
spatialdata = { git = "https://github.com/scverse/spatialdata", branch = "claude/mudata-support-sdata-c2tfjf" }
spatialdata-io = { git = "https://github.com/timtreis/spatialdata-io", branch = "claude/mudata-support-sdata-c2tfjf" }
spatialdata-plot = { git = "https://github.com/scverse/spatialdata-plot", branch = "claude/mudata-support-sdata-c2tfjf" }
# the cp_measure image features of squidpy are not in a release yet (1.8.3 predates them); this branch scales the
# images to 0-1 per channel, which cp_measure's texture needs (scverse/squidpy#1321), and runs cp_measure 0.3 with its
# numba accelerator, 1.5x faster with the same values
squidpy = { git = "https://github.com/timtreis/squidpy", branch = "feat/cp-measure-0.3-numba" }
# cp_measure 0.3 (batched featurize, numba backends) is not released yet
cp-measure = { git = "https://github.com/afermg/cp_measure", rev = "c698d440e6b669222efdf0d128dad88843bf2677" }
# mantispy (feature selection of the image features) is not released yet
mantispy = { git = "https://github.com/scverse/mantispy", rev = "main" }

[tool.ruff]
line-length = 120
lint.select = [ "E", "F", "I", "W" ]
